<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一日一知｜一覧表示</title>
<style>
@font-face{
  font-family:"りいてがき筆";
  src:url("./RiiT_F.otf") format("opentype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg1:#06382f;
  --bg2:#075044;
  --bg3:#04382f;
  --paper:#fffefb;
  --green:#176b55;
  --green2:#2c866b;
  --line:#dfe4dc;
  --purple:#8750c9;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:#18251f;
  font-family:"りいてがき筆",sans-serif;
  background:linear-gradient(145deg,var(--bg1),var(--bg2) 50%,var(--bg3));
}
.page{width:min(1080px,calc(100% - 28px));margin:auto;padding:28px 0 40px}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  color:#fff;margin-bottom:22px;
}
.list-title-line{display:flex;align-items:center;gap:14px;white-space:nowrap;min-width:0}
.title-star{width:72px;height:72px;object-fit:contain;flex:0 0 auto}
.title-wrap{min-width:0;flex:1}.title-wrap h1{font-size:clamp(30px,4vw,48px);margin:0;letter-spacing:.05em;white-space:nowrap}
.title-wrap p{margin:8px 0 0;font-size:18px;opacity:.9}
.back{
  color:#fff;text-decoration:none;border:2px solid rgba(255,255,255,.7);
  border-radius:999px;padding:10px 22px;font-size:18px;
}
.card{
  background:rgba(255,254,251,.985);
  border-radius:28px;
  box-shadow:0 12px 34px rgba(0,0,0,.18);
  padding:28px;
}
.guide{
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  margin-bottom:18px;color:#53635a;font-size:16px;
}
.count{color:var(--green);font-size:20px}
.list{display:grid;gap:12px}
.item{
  display:grid;
  grid-template-columns:150px 1fr auto;
  gap:14px;
  align-items:start;
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
  background:#fff;
}
.item.editing{border-color:#7ab59e;box-shadow:0 0 0 3px rgba(65,135,105,.10)}
.date-view{color:var(--green);font-size:17px;padding-top:7px}
.text-view{font-size:18px;line-height:1.55;padding-top:5px}
.actions{display:flex;gap:8px}
.btn{
  font-family:"りいてがき筆",sans-serif;
  border:0;border-radius:999px;padding:9px 16px;cursor:pointer;font-size:16px;
}
.edit{background:#e8f2ed;color:var(--green)}
.delete{background:#fff0f0;color:#b33;border:1px solid #efcaca}
.save{background:var(--green);color:#fff}
.cancel{background:#eee;color:#555}
.edit-fields{display:none;grid-column:1/3;grid-template-columns:150px 1fr;gap:14px}
.item.editing .date-view,.item.editing .text-view{display:none}
.item.editing .edit-fields{display:grid}
.item.editing .edit,.item.editing .delete{display:none}
.item:not(.editing) .save,.item:not(.editing) .cancel{display:none}
input,textarea{
  width:100%;font-family:"りいてがき筆",sans-serif;font-size:17px;
  border:2px solid #d8e2dc;border-radius:12px;padding:11px 13px;outline:none;
}
textarea{min-height:92px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{border-color:#6aa68e}
.star{
  border:0;background:transparent;color:#aaa;font-size:31px;cursor:pointer;
  padding:0 5px;line-height:1;
}
.star.on{color:#f0ad00}
.empty{text-align:center;padding:50px;color:#6f796f;font-size:19px}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);
  background:#174f40;color:#fff;padding:12px 24px;border-radius:999px;
  transition:.25s;box-shadow:0 7px 24px rgba(0,0,0,.24)
}
.toast.show{transform:translate(-50%,0)}
.note{
  color:white;text-align:center;margin-top:18px;font-size:14px;opacity:.85
}
@media(max-width:760px){
  .page{width:calc(100% - 16px);padding-top:14px}
  .top{align-items:flex-start;gap:8px}.title-star{width:42px;height:42px}.title-wrap h1{font-size:clamp(22px,6vw,34px);letter-spacing:.02em}.title-wrap p{font-size:14px}.back{flex:0 0 auto}
  .back{font-size:14px;padding:8px 13px}
  .card{padding:17px 11px}
  .guide{display:block}.count{margin-top:7px}
  .item{grid-template-columns:1fr auto;gap:8px}
  .date-view{grid-column:1/2}.text-view{grid-column:1/2}
  .actions{grid-column:2;grid-row:1/3;flex-direction:column}
  .edit-fields{grid-column:1/2;grid-template-columns:1fr}
}
</style>
</head>

        <h1>登録した豆知識一覧</h1>
      </div>
      <p>日付や誤字をここで直せます。</p>
    </div>
    <a class="back" href="./index.html">← トップへ戻る</a>
  </header>

  <main class="card">
    <div class="guide">
      <div>新しい日付順に表示しています。</div>
      <div class="count" id="count"></div>
    </div>
    <div class="list" id="list"></div>
  </main>

  <div class="note">編集した内容はこのブラウザに保存され、トップページにも反映されます。</div>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA_KEY="ichinichi_all_facts_v3";
const OLD_KEY="ichinichi_facts_v2";
const STAR_KEY="ichinichi_star_ids_v3";

const seedFacts=[
 {id:"seed-1",date:"2025/08/07",text:"ハチは一生のうちに、ティースプーン1杯分のハチミツしか作れない。"},
 {id:"seed-2",date:"2025/08/06",text:"バナナは「果物」じゃなくて「野菜」なんだって！"},
 {id:"seed-3",date:"2025/08/05",text:"ペンギンは膝を曲げることができない。"},
 {id:"seed-4",date:"2025/08/04",text:"カメは1日に40回もまばたきをするらしい。"},
 {id:"seed-5",date:"2025/08/03",text:"レモン1個のビタミンCは、リンゴ約5個分！"}
];

function makeId(){
  return "fact-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
}
function loadFacts(){
  let saved=JSON.parse(localStorage.getItem(DATA_KEY)||"null");
  if(saved) return saved;
  const old=JSON.parse(localStorage.getItem(OLD_KEY)||"[]");
  saved=[...seedFacts,...old.map(f=>({id:makeId(),date:f.date,text:f.text}))];
  localStorage.setItem(DATA_KEY,JSON.stringify(saved));
  return saved;
}
function saveFacts(data){localStorage.setItem(DATA_KEY,JSON.stringify(data))}
function getStars(){return JSON.parse(localStorage.getItem(STAR_KEY)||"[]")}
function setStars(v){localStorage.setItem(STAR_KEY,JSON.stringify(v))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function sorted(){
  return loadFacts().sort((a,b)=>new Date(b.date.replaceAll("/","-"))-new Date(a.date.replaceAll("/","-")));
}
function normalizeDate(v){
  const m=v.trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m)return null;
  return `${m[1]}/${String(m[2]).padStart(2,"0")}/${String(m[3]).padStart(2,"0")}`;
}
function render(){
  const data=sorted(),stars=getStars();
  document.getElementById("count").textContent=`${data.length}件`;
  document.getElementById("list").innerHTML=data.length?data.map(f=>`
    <div class="item" data-id="${f.id}">
      <div class="date-view">${esc(f.date)}</div>
      <div class="text-view">${esc(f.text)}</div>
      <div class="actions">
        <button class="star ${stars.includes(f.id)?"on":""}" title="お気に入り">${stars.includes(f.id)?"★":"☆"}</button>
        <button class="btn edit">編集</button>
        <button class="btn delete">削除</button>
        <button class="btn save">保存</button>
        <button class="btn cancel">取消</button>
      </div>
      <div class="edit-fields">
        <input class="date-input" value="${esc(f.date)}" inputmode="numeric" placeholder="2026/08/20">
        <textarea class="text-input">${esc(f.text)}</textarea>
      </div>
    </div>`).join(""):`<div class="empty">まだ豆知識がありません。</div>`;
}
document.getElementById("list").onclick=e=>{
  const item=e.target.closest(".item");
  if(!item)return;
  const id=item.dataset.id;

  if(e.target.closest(".star")){
    const stars=getStars(),i=stars.indexOf(id);
    if(i>=0)stars.splice(i,1); else stars.push(id);
    setStars(stars);render();return;
  }
  if(e.target.closest(".delete")){
    const data=loadFacts();
    const fact=data.find(x=>x.id===id);
    if(!fact)return;
    const ok=confirm(`この豆知識を削除しますか？\n\n${fact.text}`);
    if(!ok)return;

    const newData=data.filter(x=>x.id!==id);
    saveFacts(newData);

    const stars=getStars().filter(x=>x!==id);
    setStars(stars);

    render();
    toast("豆知識を削除しました");
    return;
  }

  if(e.target.closest(".edit")){
    document.querySelectorAll(".item.editing").forEach(x=>x.classList.remove("editing"));
    item.classList.add("editing");return;
  }
  if(e.target.closest(".cancel")){
    item.classList.remove("editing");return;
  }
  if(e.target.closest(".save")){
    const date=normalizeDate(item.querySelector(".date-input").value);
    const text=item.querySelector(".text-input").value.trim();
    if(!date){toast("日付は 2026/08/20 のように入力してね");return}
    if(!text){toast("豆知識の文章を入力してね");return}
    const data=loadFacts(),f=data.find(x=>x.id===id);
    if(!f)return;
    f.date=date;f.text=text;saveFacts(data);render();toast("修正を保存したよ");
  }
};
function toast(m){
  const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2000);
}
render();
</script>

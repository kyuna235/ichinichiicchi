<style>
@font-face{font-family:"りいてがき筆";src:url("./RiiT_F.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}

:root{--v:#063f35;--v2:#075447;--paper:#fffefb;--g:#176b55;--p:#8750c9}
*{box-sizing:border-box}
body{margin:0;color:#16261f;font-family:"りいてがき筆",sans-serif;font-family:"りいてがき筆",sans-serif;background:linear-gradient(145deg,#06382f,#075044 50%,#04382f);min-height:100vh}
.page{width:min(1060px,calc(100% - 32px));margin:auto;padding:28px 0 22px}
header{text-align:center;color:white;padding:4px 20px 28px;position:relative}
.brand{font-size:68px;font-weight:900;letter-spacing:.18em;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.reading{font-size:19px;font-weight:700;letter-spacing:.28em;margin-top:4px}
.tagline{font-size:28px;font-weight:900;margin-top:16px}.tagline span{color:#ff8b16}
.decor{position:absolute;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 2px rgba(255,255,255,.18))}.left{left:2.5%;top:28px;width:92px;height:92px}.right{right:2.5%;top:32px;width:88px;height:100px}
.card{background:rgba(255,254,251,.985);border-radius:27px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.register{padding:28px 30px 20px}
.head{display:flex;align-items:center;gap:18px;color:var(--g)}.icon{width:58px;height:58px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:31px;font-weight:900}.head h1,.head h2{margin:0;font-size:31px;font-weight:900}
.under{width:380px;border-top:3px dashed #22765d;margin:4px 0 23px 77px}
.reginner{position:relative;padding-right:265px}
textarea{width:100%;height:205px;resize:vertical;border:2px solid #d5d8d3;border-radius:14px;padding:20px;font:18px "りいてがき筆",sans-serif;outline:none}
textarea:focus{border-color:#64a98d;box-shadow:0 0 0 3px rgba(57,143,108,.12)}
.standing{position:absolute;width:245px;right:-2px;bottom:-10px;filter:drop-shadow(0 0 13px rgba(255,214,45,.75))}
.actions{display:flex;justify-content:flex-end;margin-top:20px}
.primary{border:0;border-radius:999px;background:var(--g);color:#fff;font:900 25px "りいてがき筆",sans-serif;padding:13px 52px;cursor:pointer;box-shadow:0 5px 0 #0c4e3e}
.list{margin-top:20px;padding:24px 30px 18px}.sub{margin:5px 0 16px 77px;color:#666;font-size:16px}.rows{border:1px solid #dfe4dc;border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:165px 1fr 54px;align-items:center;min-height:62px;padding:8px 13px 8px 10px;border-bottom:1px solid #dfe4dc}.row:last-child{border-bottom:0}
.date{justify-self:start;background:#e9f1e6;color:#145b48;border-radius:10px;padding:8px 16px;font-weight:900;font-size:16px}.fact{font-size:16px;line-height:1.5}.star{border:0;background:transparent;font-size:32px;cursor:pointer;color:#aaa}.star.on{color:#f2a900}
.more{display:block;margin:14px auto 0;border:2px solid #65a88b;color:var(--g);background:white;border-radius:999px;padding:8px 36px;font:900 17px "りいてがき筆",sans-serif;cursor:pointer}
.quiz{margin-top:20px;padding:20px 30px;display:flex;align-items:center;gap:20px;min-height:150px;overflow:hidden}.qmark{width:58px;height:58px;border-radius:50%;background:var(--p);color:white;display:grid;place-items:center;font-size:38px;font-weight:900;flex:none}.qcopy{flex:1}.qcopy h2{margin:0;color:var(--p);font-size:29px}.qcopy p{margin:7px 0 0;font-size:16px;line-height:1.55}.flying{width:205px;filter:drop-shadow(0 0 12px rgba(255,214,45,.7))}
.quizbtn{border:0;border-radius:999px;background:var(--p);color:#fff;font:900 22px "りいてがき筆",sans-serif;padding:16px 35px;cursor:pointer;white-space:nowrap}
.quizarea{display:none;margin-top:16px;padding:25px;text-align:center}.quizarea.show{display:block}.question{font-size:20px;font-weight:900;color:var(--p);margin-bottom:15px}.option{width:min(760px,100%);display:block;margin:9px auto;padding:13px 16px;background:white;border:2px solid #ddd0e9;border-radius:12px;text-align:left;font:16px "りいてがき筆",sans-serif;cursor:pointer}.option.correct{background:#e8f8df;border-color:#69ad50}.option.wrong{background:#ffe7e7;border-color:#d47b7b}.feedback{font-weight:900;margin:12px}.next{border:0;border-radius:999px;background:var(--p);color:#fff;padding:10px 28px;font-weight:900;cursor:pointer}
footer{color:white;text-align:center;padding:19px 0 0;font-size:18px;letter-spacing:.13em}.signature{font-style:italic;letter-spacing:.05em}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,130px);background:#174f40;color:white;padding:12px 24px;border-radius:999px;transition:.25s;z-index:20}.toast.show{transform:translate(-50%,0)}
@media(max-width:760px){.page{width:calc(100% - 18px);padding-top:12px}.brand{font-size:45px}.reading{font-size:13px}.tagline{font-size:19px}.decor{display:none}.register,.list{padding:20px 14px}.head h1,.head h2{font-size:24px}.under{width:70%;margin-left:0}.reginner{padding-right:0}.standing{display:none}.actions{margin-top:15px}.primary{width:100%;font-size:21px}.sub{margin-left:0}.row{grid-template-columns:88px 1fr 38px}.date{font-size:12px;padding:7px 8px}.fact{font-size:13px}.quiz{padding:18px 14px;flex-wrap:wrap}.qcopy{min-width:calc(100% - 76px)}.flying{display:none}.quizbtn{width:100%}}
</style>
</head>

<section class="card register">
<div class="head"><div class="icon">✎</div><h1>今日の豆知識を入力する</h1></div><div class="under"></div>
<div class="reginner"><textarea id="input" placeholder="ここに豆知識を書いてみよう！"></textarea><img class="standing" src="./reading.png" alt="読書している豆電球くん"></div>
<div class="actions"><button class="primary" id="add">💡　登録する</button></div>
</section>

<section class="card list">
<div class="head"><div class="icon">☷</div><h2>一覧表示</h2></div><div class="sub">新しい順に表示しています</div>
<div class="rows" id="rows"></div><button class="more" id="more">もっと見る　⌄</button>
</section>

<section class="card quiz">
<div class="qmark">?</div><div class="qcopy"><h2>クイズに挑戦！</h2><p>登録した豆知識からランダムに<br>クイズが出るよ！</p></div>
<img class="flying" src="./quiz.png" alt="両手を上げている豆電球くん"><button class="quizbtn" id="start">▶　クイズをスタート</button>
</section>

<section class="card quizarea" id="quizarea"><div class="question" id="question"></div><div id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next">次の問題</button></section>
<footer><span class="signature">コピーライティング by Naoki</span></footer>
</div><div class="toast" id="toast"></div>

<script>
const KEY="ichinichi_facts_v2";
const initial=[
{date:"2025/08/07",text:"ハチは一生のうちに、ティースプーン1杯分のハチミツしか作れない。"},
{date:"2025/08/06",text:"バナナは「果物」じゃなくて「野菜」なんだって！"},
{date:"2025/08/05",text:"ペンギンは膝を曲げることができない。"},
{date:"2025/08/04",text:"カメは1日に40回もまばたきをするらしい。"},
{date:"2025/08/03",text:"レモン1個のビタミンCは、リンゴ約5個分！"}];
let facts=JSON.parse(localStorage.getItem(KEY)||"[]"),shown=5,quizData=[],answer=-1;
function allFacts(){return [...initial,...facts].sort((a,b)=>new Date(b.date.replaceAll("/","-"))-new Date(a.date.replaceAll("/","-")))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){let d=allFacts();document.getElementById("rows").innerHTML=d.slice(0,shown).map((f,i)=>`<div class="row"><div class="date">${esc(f.date)}</div><div class="fact">${esc(f.text)}</div><button class="star" data-i="${i}">☆</button></div>`).join("");document.getElementById("more").style.display=d.length>shown?"block":"none";loadStars()}
function loadStars(){let s=JSON.parse(localStorage.getItem("ichinichi_stars")||"[]");document.querySelectorAll(".star").forEach(b=>{if(s.includes(+b.dataset.i)){b.classList.add("on");b.textContent="★"}})}
document.getElementById("add").onclick=()=>{let el=document.getElementById("input"),text=el.value.trim();if(!text){toast("豆知識を書いてみよう！");return}let d=new Date();facts.push({date:`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`,text});localStorage.setItem(KEY,JSON.stringify(facts));el.value="";shown=5;render();toast("豆知識を登録したよ！💡")};
document.getElementById("more").onclick=()=>{shown+=5;render()};
document.getElementById("rows").onclick=e=>{let b=e.target.closest(".star");if(!b)return;let i=+b.dataset.i,s=JSON.parse(localStorage.getItem("ichinichi_stars")||"[]"),p=s.indexOf(i);if(p>=0){s.splice(p,1);b.classList.remove("on");b.textContent="☆"}else{s.push(i);b.classList.add("on");b.textContent="★"}localStorage.setItem("ichinichi_stars",JSON.stringify(s))};
function makeQuiz(){let d=allFacts();let correct=d[Math.floor(Math.random()*d.length)],others=d.filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,3);quizData=[correct,...others].sort(()=>Math.random()-.5);answer=quizData.indexOf(correct);document.getElementById("question").textContent="次のうち、登録されている豆知識はどれ？";document.getElementById("feedback").textContent="";document.getElementById("options").innerHTML=quizData.map((f,i)=>`<button class="option" data-i="${i}">${esc(f.text)}</button>`).join("")}
document.getElementById("start").onclick=()=>{document.getElementById("quizarea").classList.add("show");makeQuiz();document.getElementById("quizarea").scrollIntoView({behavior:"smooth",block:"center"})};
document.getElementById("options").onclick=e=>{let b=e.target.closest(".option");if(!b)return;let i=+b.dataset.i;document.querySelectorAll(".option").forEach(x=>x.disabled=true);if(i===answer){b.classList.add("correct");document.getElementById("feedback").textContent="正解！✨"}else{b.classList.add("wrong");document.querySelectorAll(".option")[answer].classList.add("correct");document.getElementById("feedback").textContent="おしい！正解はこちら。"}};
document.getElementById("next").onclick=makeQuiz;
function toast(m){let t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),2200)}
render();
</script>
</body></html>
